name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.site.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The tests and tools type-checked too (the build checks src/), the linter, the layout.
      - run: npx tsc --noEmit -p scripts
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # Does this push change the game? Not when every file it touches is the docs, the tests and dev
      # tools, the skills, the map viewer or the lint and format settings (none of them is in dist/).
      # The files are git's (the push's two trees compared: the push's commit list carried no files,
      # so nothing deployed from 2.34.1 to 2.34.2). Unsure (a manual run, a new branch, no files,
      # the diff failing): deploy.
      - id: site
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          node -e '
            const { execSync } = require("child_process");
            const tools = /^(docs\/|scripts\/|\.claude\/|assets\/maps\/|[^/]+\.md$|\.(oxlintrc\.json|prettierrc\.json|prettierignore|git-blame-ignore-revs)$)/;
            const before = process.env.BEFORE ?? "";
            let files = [];
            if (/^[0-9a-f]{40}$/.test(before) && !/^0+$/.test(before)) {
              try {
                execSync(`git fetch --depth=1 origin ${before}`, { stdio: "ignore" });
                files = execSync(`git diff --name-only ${before} HEAD`).toString().split("\n").filter(Boolean);
              } catch {}
            }
            const deploy = files.length === 0 || files.some((f) => !tools.test(f));
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `deploy=${deploy}\n`);
            console.log(`${files.length} files changed: ` + (deploy ? "the game may have changed (or unsure): deploy" : "docs and tools only: no deploy"));
          '
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.site.outputs.deploy == 'true'
        with:
          path: dist

  # Publishes the game on GitHub Pages (main only, once the checks pass).
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
