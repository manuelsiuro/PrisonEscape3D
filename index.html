<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b2230" />
    <title>Prison Escape 3D</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      // Boot guard: if the game hasn't started after a while (a broken offline copy, a
      // missing file), forget the offline copy and load once more from the server.
      // main.ts sets window.__pe3dBooted.
      setTimeout(function () {
        if (window.__pe3dBooted || sessionStorage.getItem('pe3d.rescued')) return;
        try {
          sessionStorage.setItem('pe3d.rescued', '1');
        } catch (e) {}
        var regs = navigator.serviceWorker ? navigator.serviceWorker.getRegistrations() : Promise.resolve([]);
        Promise.all([
          regs.then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }),
          window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : null,
        ]).finally(function () {
          location.reload();
        });
      }, 12000);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
